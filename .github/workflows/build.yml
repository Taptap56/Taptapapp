name: Build TaptapApp-Go

# Build manual saja (tombol Run workflow), seperti builder kernel.
# Tidak ada GitHub Releases: hasil hanya lewat artifact Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build module (slim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod minta go 1.21; 1.27 adalah versi yang terverifikasi
          # membangun source ini secara lokal.
          go-version: '1.27'

      - name: Read version
        id: ver
        run: echo "ver=$(grep -E '^version=' src/module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build module (slim)
        # Slim = default: tanpa core/geodata/zashboard/scrcpy bawaan,
        # jadi build ini tidak butuh aset eksternal apa pun.
        run: sh src/build.sh

      - name: Upload module + source zips
        uses: actions/upload-artifact@v4
        with:
          name: taptapapp-go-${{ steps.ver.outputs.ver }}
          path: src/dist/*.zip
          if-no-files-found: error
