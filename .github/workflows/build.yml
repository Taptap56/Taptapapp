name: Build TaptapApp-Go

# Build manual saja (tombol Run workflow), seperti builder kernel.
# Hasil diterbitkan otomatis sebagai GitHub Release (bukan artifact):
# tiap Run workflow membuat/memperbarui Release dengan tag = versi
# dari src/module/module.prop, dan 2 zip instalasi (arm64 + v7a) jadi
# aset Release-nya. Salah pilih zip ditolak installer di awal.
# Catatan: tag yang sudah ada akan diperbarui asetnya, jadi Run ulang
# dengan versi yang sama menimpa Release versi itu.
# Untuk percobaan TANPA menimpa Release, pakai workflow
# build-artifact.yml (hasilnya artifact Actions, bukan Release).
on:
  workflow_dispatch:

permissions:
  # write diperlukan untuk membuat tag + Release + mengunggah asetnya.
  contents: write

jobs:
  build:
    name: Build module (slim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod minta go 1.21; 1.27 adalah versi yang terverifikasi
          # membangun source ini secara lokal.
          go-version: '1.27'

      - name: Read version
        id: ver
        run: echo "ver=$(grep -E '^version=' src/module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build module (slim)
        # Slim = default: tanpa core/geodata/zashboard/scrcpy bawaan,
        # jadi build ini tidak butuh aset eksternal apa pun.
        run: sh src/build.sh

      - name: Publish Release
        # Hanya zip instalasi yang diterbitkan sebagai aset Release;
        # zip source tidak ikut, supaya Release langsung bisa dipasang.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.ver }}
          name: TaptapApp-Go ${{ steps.ver.outputs.ver }}
          body: |
            Perubahan di build ini:
            - SSH (sshfix2): connect_timeout dihapus (core tidak memutus
              dial jembatan di tengah jalan), host_key_algorithms
              eksplisit modern-dulu + ssh-rsa terakhir (Dropbear lama
              2019.78 hanya menandatangani RSA dengan ssh-rsa), dan
              client_version dikunci SSH-2.0-OpenSSH_7.8.
            - WebUI baru model gerak (clay, logo bergerak) menggantikan
              WebUI lama.
            - Dukungan HP 32-bit armeabi-v7a: aset Release kini ada 2,
              arm64 dan v7a — pilih sesuai HP, salah pilih ditolak
              installer. Di HP v7a, kotak Download core kini memilih
              aset android-armv7 (sebelumnya selalu android-arm64).

            Penambahan: SSH gaya HTTP Custom — akun SSH kini bisa pakai
            payload, proxy jarak jauh, TLS + SNI, dan mode WebSocket /
            Pipa mentah, lewat jembatan lokal di daemon. Copy SSH kini
            membawa semua setingan (payload, proxy, mode, TLS), bukan
            cuma akunnya. WebUI juga selalu segar tiap flash dan
            service worker-nya tidak lagi menyimpan cache, jadi tidak
            ada lagi WebUI lama yang nyangkut.

            Penambahan: BadVPN — UDP game/QUIC kini bisa lewat server
            SSH (sebelumnya SSH hanya TCP, UDP selalu gagal). Aktifkan
            di Pengaturan → BadVPN, isi port UDPGW server (default
            7300), lalu Simpan & Terapkan. Syarat: server SSH harus
            menjalankan badvpn-udpgw; bila tidak, log akan memberi
            tahu dan UDP lewat SSH tetap tidak jalan. Hanya berlaku
            untuk server SSH terpilih dan mode config OTOMATIS.

            ‼️ PENTING bagi yang sudah memasang versi sebelum ini:
            hapus data situs 2 kali sebelum memakai versi ini —
            (1) ketuk ikon ⓘ di address bar Chrome → "Cookie dan
            data situs" → ikon tong sampah, dan (2) Setelan Chrome →
            Privasi dan keamanan → "Hapus data penjelajahan" →
            centang "Cookie dan data situs" → "Hapus data". Sesudah
            itu buka WebUI sekali; mulai dari versi ini WebUI akan
            selalu segar sendiri tanpa hapus manual lagi.

            Paket SLIM: core (sing-box, mihomo), geodata, zashboard, dan
            scrcpy-server tidak dibundel. Sesudah flash, unduh semuanya
            lewat kotak Download di menu Tentang WebUI, urutannya:
            Core mihomo, Core sing-box, Geodata, Zashboard, Scrcpy.
          files: |
            src/dist/taptapapp-go-${{ steps.ver.outputs.ver }}-arm64.zip
            src/dist/taptapapp-go-${{ steps.ver.outputs.ver }}-v7a.zip
          fail_on_unmatched_files: true
