<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#080b0f">
<title>Masuk — TaptapApp-Go</title>
<link rel="icon" href="icons/icon-192.png">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f7f0e8;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0e1217,#080b0f 320px),#080b0f;min-height:100vh;padding:24px}
.box{position:relative;width:100%;max-width:350px;text-align:center;background:linear-gradient(145deg,#262d36,#151a21);border-radius:38px;padding:38px 28px 30px;box-shadow:inset 3px 3px 7px rgba(255,255,255,.09),inset -4px -8px 16px rgba(0,0,0,.45),12px 18px 40px rgba(0,0,0,.65),-3px -3px 9px rgba(255,255,255,.025)}
.logo{width:112px;height:112px;border-radius:34px;box-shadow:0 0 0 2px rgba(255,255,255,.08),8px 12px 26px rgba(0,0,0,.6)}
h1{font-size:27px;font-weight:800;margin:20px 0 4px;letter-spacing:-.3px}h1 .go{color:#34d399}
.sub{color:#9aa4b5;font-size:13px;margin-bottom:24px}
input{width:100%;padding:15px 16px;font-size:16px;color:#f7f0e8;background:#0b0e12;border:0;border-radius:20px;outline:none;text-align:center;letter-spacing:2px;box-shadow:inset 4px 5px 10px rgba(0,0,0,.6),inset -2px -3px 6px rgba(255,255,255,.05)}
input:focus{box-shadow:inset 4px 5px 10px rgba(0,0,0,.6),0 0 0 2px rgba(76,240,189,.75)}
button{width:100%;margin-top:16px;padding:15px;font-size:16px;font-weight:800;color:#03241b;background:linear-gradient(135deg,#34f0b8,#0ea5a0);border:0;border-radius:20px;cursor:pointer;box-shadow:inset 3px 4px 7px rgba(255,255,255,.42),inset -4px -7px 12px rgba(0,95,72,.55),5px 8px 16px rgba(0,0,0,.5)}
button:active{transform:scale(.97);box-shadow:inset 4px 5px 10px rgba(0,80,60,.6),inset -2px -3px 6px rgba(160,255,225,.25)}
button:disabled{opacity:.6}
.err{display:none;margin-top:14px;font-size:13px;font-weight:600;color:#ff9aa4;background:#0b0e12;border-radius:16px;padding:10px;box-shadow:inset 3px 4px 8px rgba(0,0,0,.55)}
.err.show{display:block;animation:shake .3s}@keyframes shake{25%{transform:translate(-5px)}75%{transform:translate(5px)}}
.foot{margin-top:20px;font-size:11px;color:#6f7a8b}</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="icons/icon-192.png" alt="TaptapApp">
    <h1>TaptapApp-<span class="go">Go</span></h1>
    <div class="sub">Masukkan password untuk masuk</div>
    <form id="f" autocomplete="off">
      <input id="p" type="password" placeholder="Password" autocomplete="current-password">
      <button id="b" type="submit">Masuk</button>
    </form>
    <div class="err" id="e">Password salah, coba lagi.</div>
    <div class="foot">Cukup sekali — setelah ini langsung masuk otomatis.</div>
  </div>
<script>var f=document.getElementById("f"),p=document.getElementById("p"),b=document.getElementById("b"),e=document.getElementById("e");p.focus(),f.addEventListener("submit",function(t){t.preventDefault(),e.classList.remove("show"),b.disabled=!0,b.textContent="Memeriksa\u2026",fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p.value})}).then(function(n){if(n.ok){location.href="/taptapapp/";return}throw 0}).catch(function(){e.classList.add("show"),b.disabled=!1,b.textContent="Masuk",p.select()})});</script>
</body>
</html>
